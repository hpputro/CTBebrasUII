<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petualangan Bina · Berpikir Komputasional dan AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  #home{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(180deg,#DDF0F5 0%,#EAF4F7 55%,#E3F1E4 100%)}
  .hero{display:flex;align-items:center;gap:22px;padding:26px 40px 0}
  .hero .bina{width:96px;height:96px}
  .hero h1{font-size:2.5em;line-height:1;color:var(--navy);font-weight:800}
  .hero p{color:var(--muted);font-size:1.05em;margin-top:6px}
  .hero .spacer{flex:1}
  .hero .tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .map{position:relative;margin:0 40px;min-height:0}
  .map svg.river{position:absolute;inset:0;width:100%;height:100%}
  .station{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;color:var(--ink);width:min(26vw,300px)}
  .station .disc{width:clamp(84px,9vw,128px);height:clamp(84px,9vw,128px);border-radius:50%;display:grid;place-items:center;font-size:clamp(40px,4.4vw,64px);border:6px solid #fff;box-shadow:0 8px 0 rgba(30,46,92,.18);transition:transform .15s}
  .station:hover .disc,.station:focus-visible .disc{transform:scale(1.07)}
  .station .card{background:#fff;border-radius:18px;padding:10px 16px;text-align:center;box-shadow:0 4px 0 rgba(30,46,92,.1);width:100%}
  .station .card b{display:block;color:var(--navy);font-size:1.1em;line-height:1.1}
  .station .card span{color:var(--muted);font-size:.82em;display:block}
  .station .card .st{color:var(--gold-d);font-weight:800;font-size:.85em;margin-top:2px}
  .station .num{position:absolute;top:-6px;left:calc(50% + clamp(26px,3.2vw,46px));background:var(--navy);color:#fff;border-radius:999px;font-weight:800;font-size:.8em;padding:2px 10px}
  .foot{display:flex;justify-content:space-between;align-items:center;padding:10px 40px 18px;color:var(--muted);font-size:.85em;gap:16px;flex-wrap:wrap}
  .foot label{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;color:var(--navy)}
  .foot input{width:24px;height:24px;accent-color:var(--navy)}
  .btn-dark{background:var(--navy);color:#fff}
  #stage{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--sky);display:none}
  #stage.show{display:block}
  @media (max-width:820px){
    .map svg.river{display:none}
    .map{display:grid;grid-template-columns:1fr 1fr;gap:16px;overflow:auto;padding:10px 0}
    .station{position:relative;transform:none;width:auto;left:auto!important;top:auto!important}
    .hero{flex-wrap:wrap;padding:16px}
    .hero h1{font-size:1.8em}
    .foot,.map{padding-left:16px;padding-right:16px;margin:0}
  }
</style>
</head>
<body>
<div id="home">
  <header class="hero">
    <div id="binaHero"></div>
    <div><h1>Petualangan Bina</h1><p>Empat permainan untuk berlatih berpikir komputasional dan mengenal cara kerja AI</p></div>
    <div class="spacer"></div>
    <div class="tools">
      <button class="btn btn-soft" id="openGuide"><span class="icon">📘</span> Panduan guru</button>
      <button class="btn btn-main" id="full"><span class="icon">⛶</span> Layar penuh</button>
    </div>
  </header>
  <main class="map" id="map" aria-label="Peta permainan">
    <svg class="river" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-20 420 C 120 420, 160 300, 270 300 S 430 420, 520 330 S 640 120, 760 170 S 900 260, 1020 90" fill="none" stroke="#9FD3DC" stroke-width="64" stroke-linecap="round"/>
      <path d="M-20 420 C 120 420, 160 300, 270 300 S 430 420, 520 330 S 640 120, 760 170 S 900 260, 1020 90" fill="none" stroke="#C9EAF0" stroke-width="18" stroke-dasharray="2 34" stroke-linecap="round"/>
    </svg>
  </main>
  <footer class="foot">
    <label><input type="checkbox" id="unlock"> Mode guru: buka semua level</label>
    <span id="total"></span>
    <button class="btn btn-soft" id="reset">Hapus kemajuan</button>
  </footer>
</div>
<iframe id="stage" title="Permainan" allow="fullscreen"></iframe>

<script>
const GAMES = [
  { id:'g1', file:'mesin-buah.html', icon:'🍎', name:'Mesin Penebak Buah', idea:'Mesin belajar dari contoh', kelas:'Kelas 2–6', color:'#F4A24B', x:15, y:68 },
  { id:'g2', file:'pohon-tebakan.html', icon:'🌳', name:'Pohon Tebakan', idea:'Menebak dengan pertanyaan ya/tidak', kelas:'Kelas 3–6', color:'#6CBF6E', x:39, y:76 },
  { id:'g3', file:'robot-bina.html', icon:'🦫', name:'Robot Bina', idea:'Menyusun perintah langkah demi langkah', kelas:'Kelas 1–4', color:'#5BC0CC', x:62, y:36 },
  { id:'g4', file:'kertas-cerdas.html', icon:'📜', name:'Kertas yang Cerdas', idea:'Mesin yang mengikuti aturan', kelas:'Kelas 4–6', color:'#8C8FE0', x:85, y:52 }
];
const KEY = 'bina-progress-v1';
let state = { progress:{}, unlockAll:false };
try { const s = JSON.parse(localStorage.getItem(KEY)||'null'); if (s) state = Object.assign(state, s); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

document.getElementById('binaHero').innerHTML = `<svg class="bina" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="44" r="30" fill="#A8692F"/><circle cx="18" cy="20" r="8" fill="#A8692F"/><circle cx="62" cy="20" r="8" fill="#A8692F"/><circle cx="18" cy="20" r="4" fill="#7A4A1E"/><circle cx="62" cy="20" r="4" fill="#7A4A1E"/><ellipse cx="40" cy="54" rx="17" ry="13" fill="#E8C49A"/><circle cx="29" cy="38" r="5" fill="#fff"/><circle cx="51" cy="38" r="5" fill="#fff"/><circle cx="30" cy="39" r="2.6" fill="#1E2E5C"/><circle cx="52" cy="39" r="2.6" fill="#1E2E5C"/><ellipse cx="40" cy="48" rx="6" ry="4.5" fill="#3B2410"/><rect x="35" y="55" width="4.5" height="7" rx="1" fill="#fff"/><rect x="40.5" y="55" width="4.5" height="7" rx="1" fill="#fff"/></svg>`;

const map = document.getElementById('map');
function drawStations(){
  map.querySelectorAll('.station').forEach(e => e.remove());
  let total = 0;
  GAMES.forEach((g,i) => {
    const p = state.progress[g.id] || {};
    const s = [1,2,3,4].reduce((a,l) => a + (p[l]||0), 0); total += s;
    const b = document.createElement('button');
    b.className = 'station'; b.style.left = g.x + '%'; b.style.top = g.y + '%';
    b.setAttribute('aria-label', `${g.name}. ${g.idea}. ${s} dari 12 bintang`);
    b.innerHTML = `<span class="num">${i+1}</span><span class="disc" style="background:${g.color}">${g.icon}</span>
      <span class="card"><b>${g.name}</b><span>${g.idea}</span><span>${g.kelas}</span><span class="st">★ ${s} / 12</span></span>`;
    b.onclick = () => open(g.file);
    map.appendChild(b);
  });
  document.getElementById('total').textContent = `Total bintang: ${total} dari 48`;
  document.getElementById('unlock').checked = state.unlockAll;
}
drawStations();

const stage = document.getElementById('stage');
function open(file){ stage.src = file; stage.classList.add('show'); document.getElementById('home').style.visibility = 'hidden'; }
function goHome(){ stage.classList.remove('show'); stage.src = 'about:blank'; document.getElementById('home').style.visibility = 'visible'; drawStations(); }
function sendState(){ stage.contentWindow && stage.contentWindow.postMessage({ bina:'state', progress:state.progress, unlockAll:state.unlockAll }, '*'); }
function toggleFull(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen && document.exitFullscreen();
}
window.addEventListener('message', e => {
  const d = e.data || {};
  if (d.bina === 'ready') sendState();
  if (d.bina === 'save') {
    const g = state.progress[d.game] = state.progress[d.game] || {};
    if (d.stars > (g[d.level]||0)) g[d.level] = d.stars;
    save(); sendState();
  }
  if (d.bina === 'home') goHome();
  if (d.bina === 'fullscreen') toggleFull();
  if (d.bina === 'open' && d.file) open(d.file);
});
document.getElementById('full').onclick = toggleFull;
document.getElementById('openGuide').onclick = () => open('guru.html');
document.getElementById('unlock').onchange = e => { state.unlockAll = e.target.checked; save(); };
document.getElementById('reset').onclick = () => { if (confirm('Hapus semua bintang dan kemajuan di perangkat ini?')) { state.progress = {}; save(); drawStations(); } };
</script>
</body>
</html>
