<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agen Penjelajah · Ekspedisi Bina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  :root{--accent:#3E8E5A}
  .board{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:18px;flex:1;min-height:0}
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#DFF1E4;border-color:#BFE0C8;overflow:auto}
  .grid{display:grid;gap:5px;width:min(100%,62vh,620px)}
  .cell{aspect-ratio:1;border-radius:12px;background:#F7FBF8;position:relative;display:grid;place-items:center;font-size:clamp(20px,3vh,38px);overflow:hidden}
  .cell.rock{background:#9AA9B8}.cell.river{background:#8CC8E8}.cell.goal{background:#FFE7A8}.cell.tre{background:#FFD36B}
  .cell .heat{position:absolute;inset:0;background:#E8892E;pointer-events:none}
  .cell .arr{position:absolute;right:4px;bottom:2px;font-size:.45em;color:#1E2E5C;font-weight:800;opacity:.8}
  .cell .bot{position:absolute;inset:8%;display:grid;place-items:center;z-index:2}
  .cell .bot svg{width:90%;height:90%}
  .cell.path{outline:3px solid #1E2E5C;outline-offset:-3px}
  .side{display:flex;flex-direction:column;gap:10px;overflow:auto}
  .tgl{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);cursor:pointer}
  .tgl input{width:24px;height:24px;accent-color:var(--navy)}
  .chartbox{background:var(--sky);border-radius:14px;padding:8px 10px}
  .legendrow{display:flex;gap:14px;flex-wrap:wrap;font-size:.8em;color:var(--muted)}
  @media (max-width:1000px){.board{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="main">
    <section class="story" id="story"></section>
    <section class="board">
      <div class="panel stage"><div class="grid" id="grid"></div><div class="legendrow"><span>🏠 tujuan</span><span>🌊 sungai</span><span>🪙 koin</span><span>💎 harta</span><span>🟧 makin oranye = makin sering dikunjungi</span></div></div>
      <div class="panel side" id="side"></div>
    </section>
  </div>
</div>
<script src="common.js"></script>
<script src="agen_sim.js"></script>
<script>
const INFO = [
  { title:'Mengamati agen belajar', story:'Kali ini kamu <b>tidak menulis perintah</b>. Agen Bina belajar sendiri dengan mencoba-coba dan menerima hadiah atau hukuman. Tekan <b>Latih</b> dan amati.' },
  { title:'Merancang hadiah', story:'Hadiah di peta ini dirancang buruk, jadi agen tidak belajar dengan benar. Ubah nilai hadiah dan hukuman sampai agen menempuh jalan terpendek ke rumah.' },
  { title:'Akal-akalan hadiah', story:'Ada koin di dekat titik awal. Setiap kali agen menginjaknya, ia dapat +3. Latih agen dan lihat apa yang terjadi. Lalu perbaiki aturan hadiahnya.' },
  { title:'Rasa ingin tahu', story:'Ada pintu keluar kecil (+5) yang dekat dan harta 💎 (+20) yang jauh. Agen yang tidak penasaran berhenti di pintu pertama yang ia temukan. Atur <b>rasa ingin tahu</b> agar agen menemukan hartanya.' },
];
const NAMES = { goal:'Hadiah sampai rumah', step:'Hukuman setiap langkah', river:'Hukuman masuk sungai', coin:'Hadiah koin' };
const RANGE = { goal:[0,30], step:[-3,0], river:[-20,0], coin:[0,5] };
const ARROW = ['↑','→','↓','←'];
let L = 1, lv, R, coinOnce, q0, result, runs, anim;
const $ = id => document.getElementById(id);
const hdr = Bina.header({ game:'g6', icon:'🧭', title:'Agen Penjelajah', count:4, current:() => L, onPick:start, onHelp:help });
function help(){ Bina.info('Cara bermain', `<p>Agen memulai tanpa tahu apa pun. Dalam setiap percobaan, ia melangkah, menerima <b>hadiah</b> (angka positif) atau <b>hukuman</b> (angka negatif), lalu memperbarui “catatan nilai” setiap langkah.</p><p style="margin-top:10px">Setelah ratusan percobaan, agen memilih langkah yang catatannya paling tinggi. Panah kecil di setiap kotak menunjukkan langkah pilihan agen di kotak itu.</p><p style="margin-top:10px">Cara belajar ini disebut <b>pembelajaran penguatan</b> (<i>reinforcement learning</i>).</p>`); }
function start(n){
  L = n; lv = AG_LEVELS[n-1]; R = { ...lv.R }; coinOnce = !!lv.coinOnce; q0 = 0; result = null; runs = 0; clearInterval(anim);
  $('story').innerHTML = `${Bina.bina}<div><h2>Level ${n}: ${INFO[n-1].title}</h2><p>${INFO[n-1].story}</p></div>`;
  hdr.redraw(); grid(); side();
}
function grid(pathUpto){
  const g = $('grid'); g.style.gridTemplateColumns = `repeat(${lv.map[0].length},1fr)`; g.innerHTML = '';
  const vmax = result ? Math.max(1, ...Object.values(result.visits)) : 1;
  const onPath = new Set(result && pathUpto !== undefined ? result.path.slice(0, pathUpto + 1).map(p => p.join(',')) : []);
  const pos = result && pathUpto !== undefined ? result.path[Math.min(pathUpto, result.path.length - 1)] : null;
  lv.map.forEach((row, r) => [...row].forEach((ch, c) => {
    const d = document.createElement('div'); d.className = 'cell';
    const icon = { '#':'🪨', W:'🌊', G:'🏠', E:'🚪', T:'💎', C:'🪙' }[ch] || '';
    if (ch === '#') d.classList.add('rock'); if (ch === 'W') d.classList.add('river'); if (ch === 'G' || ch === 'E') d.classList.add('goal'); if (ch === 'T') d.classList.add('tre');
    let html = '';
    if (result && ch !== '#') { const v = (result.visits[r + ',' + c] || 0) / vmax; html += `<span class="heat" style="opacity:${(v * 0.55).toFixed(2)}"></span>`; }
    html += `<span style="position:relative">${icon}</span>`;
    if (result && result.policy[r + ',' + c] !== undefined && '.SC'.includes(ch)) html += `<span class="arr">${ARROW[result.policy[r + ',' + c]]}</span>`;
    const isStart = ch === 'S';
    if ((pos && pos[0] === r && pos[1] === c) || (!pos && isStart)) html += `<span class="bot">${Bina.bina}</span>`;
    d.innerHTML = html; if (onPath.has(r + ',' + c)) d.classList.add('path');
    g.appendChild(d);
  }));
}
function side(){
  const keys = L === 4 ? [] : ['goal','step','river'].concat(lv.map.join('').includes('C') ? ['coin'] : []);
  let h = `<h3>🎁 Aturan hadiah</h3>`;
  keys.forEach(k => { const lock = lv.lock.includes(k); h += `<div class="slider"><label for="r${k}">${NAMES[k]}</label><input type="range" id="r${k}" min="${RANGE[k][0]}" max="${RANGE[k][1]}" step="1" value="${R[k]}" ${lock ? 'disabled' : ''}><output>${R[k] > 0 ? '+' : ''}${R[k]}</output></div>`; });
  if (L === 3) h += `<label class="tgl"><input type="checkbox" id="once" ${coinOnce ? 'checked' : ''}> Koin hanya bisa diambil sekali</label>`;
  if (L === 4) h += `<p class="pill" style="align-self:flex-start">Pintu kecil 🚪 +5 · Harta 💎 +20</p><div class="slider"><label for="cur">Rasa ingin tahu</label><input type="range" id="cur" min="0" max="10" step="1" value="${q0}"><output>${q0}</output></div><p class="hint">Rasa ingin tahu = seberapa tinggi agen membayangkan nilai jalan yang belum pernah ia coba.</p>`;
  h += `<div class="actions" style="justify-content:flex-start"><button class="btn btn-main" id="train"><span class="icon">▶</span> Latih ${lv.episodes} percobaan</button></div>`;
  h += `<div class="chartbox" id="chart">${result ? Bina.lineChart([{ name:'total hadiah per percobaan (rata-rata 10)', color:'#3E8E5A', data: smooth(result.curve) }], { xlabel:'percobaan', label:'grafik hadiah', legend:true, h:170 }) : '<p class="hint">Grafik total hadiah per percobaan akan muncul setelah latihan.</p>'}</div>`;
  $('side').innerHTML = h;
  keys.forEach(k => { const s = $('r' + k); if (s && !s.disabled) s.oninput = e => { R[k] = +e.target.value; e.target.nextElementSibling.textContent = (R[k] > 0 ? '+' : '') + R[k]; }; });
  if ($('once')) $('once').onchange = e => coinOnce = e.target.checked;
  if ($('cur')) $('cur').oninput = e => { q0 = +e.target.value; e.target.nextElementSibling.textContent = q0; };
  $('train').onclick = train;
}
function smooth(a){ return a.map((_, i) => { const s = a.slice(Math.max(0, i - 9), i + 1); return s.reduce((x, y) => x + y, 0) / s.length; }); }
function train(){
  runs++; clearInterval(anim);
  result = trainAgent(lv, R, lv.eps, lv.episodes, coinOnce, 12345 + runs * 101, L === 4 ? q0 : 0);
  side(); let i = 0; grid(0); $('train').disabled = true;
  anim = setInterval(() => { i++; grid(i); if (i >= result.path.length - 1) { clearInterval(anim); $('train').disabled = false; setTimeout(report, 600); } }, 260);
}
function report(){
  const target = L === 4 ? 'T' : 'G', opt = shortest(lv, target), r = result;
  const ok = r.end === target, stars = ok ? (r.steps <= opt ? 3 : r.steps <= opt + 2 ? 2 : 1) : 0;
  if (stars) Bina.save('g6', L, stars);
  const what = [];
  const endTxt = { G:'sampai di rumah', E:'keluar lewat pintu kecil', T:'menemukan harta', W:'masuk ke sungai' }[r.end] || 'berputar-putar sampai langkahnya habis';
  what.push(`Setelah ${lv.episodes} percobaan, agen ${endTxt} dalam ${r.steps} langkah${opt ? ` (jalan terpendek ${opt} langkah)` : ''}.`);
  if (L === 1) what.push('Di awal, total hadiah sangat rendah karena agen berjalan acak dan sering tercebur. Grafik naik karena agen makin sering menemukan rumah lewat jalan yang lebih pendek.');
  if (L === 2) {
    if (r.end === 'W') what.push('Agen sengaja masuk sungai! Kalau setiap langkah dihukum tetapi sungai tidak, mengakhiri permainan secepatnya di sungai terasa “paling untung” bagi agen.');
    else if (!r.end) what.push('Tanpa hukuman langkah dan dengan hadiah kecil, agen tidak punya alasan kuat untuk segera pulang.');
    else what.push('Hukuman langkah mendorong agen mencari jalan pendek, dan hukuman sungai membuatnya menjauhi air.');
    what.push(`Aturanmu: rumah ${R.goal > 0 ? '+' : ''}${R.goal}, langkah ${R.step}, sungai ${R.river}.`);
  }
  if (L === 3) {
    if (!ok && r.coins > 1) what.push(`Agen mengambil koin ${r.coins} kali dan tidak pernah pulang. Bolak-balik di koin memberi lebih banyak hadiah daripada pulang ke rumah. Inilah <b>akal-akalan hadiah</b> (<i>reward hacking</i>).`);
    else what.push(coinOnce ? 'Karena koin hanya bisa diambil sekali, bolak-balik tidak lagi menguntungkan. Agen mengambil koin lalu pulang.' : 'Hadiah koin kini cukup kecil sehingga pulang ke rumah lebih menguntungkan daripada bolak-balik.');
  }
  if (L === 4) what.push(ok ? 'Agen yang penasaran menganggap jalan yang belum dicoba mungkin bernilai tinggi, jadi ia menjelajahinya sampai menemukan harta.' : 'Agen menemukan pintu kecil lebih dulu, puas dengan hadiah +5, lalu tidak pernah menjelajah lebih jauh. Ia terjebak pada pilihan yang “lumayan”.');
  Bina.result({ stars, title: ok ? (stars === 3 ? 'Agen belajar dengan baik!' : 'Agen berhasil, tapi jalannya belum terpendek') : 'Agen belum belajar yang kamu inginkan', subtitle:`Level ${L}: ${INFO[L-1].title}`,
    metrics:[[r.steps, 'langkah agen'], [opt ?? '–', 'jalan terpendek'], [Math.round(r.total), 'total hadiah akhir'], [runs, 'kali latihan']],
    what,
    ai: L === 3 ? 'Agen AI mengejar angka hadiah, bukan maksud kita. Bila aturan hadiah punya celah, AI akan menemukannya. Para peneliti keamanan AI bekerja keras merancang tujuan yang tidak bisa diakali.'
      : L === 4 ? 'Menimbang <b>eksplorasi</b> (mencoba hal baru) dan <b>eksploitasi</b> (memakai yang sudah diketahui) adalah tantangan inti pembelajaran penguatan, dari robot sampai AI pemain gim.'
      : L === 2 ? 'Dalam pembelajaran penguatan, manusia tidak menulis langkahnya, tetapi merancang <b>hadiah</b>. Hadiah yang keliru menghasilkan perilaku yang keliru, walaupun agennya “belajar” dengan benar.'
      : 'Inilah <b>pembelajaran penguatan</b>: belajar dari hadiah dan hukuman lewat banyak percobaan. Cara ini dipakai untuk melatih robot berjalan dan AI yang bermain gim. Bandingkan dengan Robot Bina di SD yang mengikuti perintahmu persis.',
    ct:['Algoritma','Evaluasi', L === 4 ? 'Abstraksi' : 'Dekomposisi'], onRetry:() => {}, next: ok && L < 4 ? () => start(L+1) : null });
}
start(1);
</script>
</body>
</html>
