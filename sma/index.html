<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Observatorium Bina · Computational Thinking dan AI untuk SMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Petualangan Bina — gaya bersama */
:root{
  --navy:#1E2E5C; --navy-2:#2B3F78; --gold:#E8B23A; --gold-d:#8A6300;
  --river:#3FA7B5; --leaf:#3E9A4C; --coral:#D9503C; --wood:#A8692F;
  --sky:#EAF4F7; --paper:#FFFFFF; --ink:#1C2440; --muted:#56607C; --line:#D5E0E8;
  --accent:#E8892E; --accent-soft:#FDEBD8;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --fs:clamp(17px,1.25vw + 6px,24px);
  --font:"Baloo 2","Trebuchet MS","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:var(--fs);color:var(--ink);background:var(--sky);line-height:1.35;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h1,h2,h3,p{margin:0}

/* kerangka halaman game */
.app{height:100vh;display:grid;grid-template-rows:auto 1fr}
.topbar{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--navy);color:#fff}
.topbar .title{font-weight:800;font-size:1.25em;display:flex;align-items:center;gap:12px;white-space:nowrap}
.topbar .title .badge{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:1.1em}
.topbar .spacer{flex:1}
.btn{border:0;border-radius:999px;padding:10px 22px;min-height:52px;font-weight:700;display:inline-flex;align-items:center;gap:10px;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.btn-main{background:var(--gold);color:var(--navy);box-shadow:0 4px 0 #B88412}
.btn-main:hover{filter:brightness(1.05)}
.btn-main:disabled{background:#D9DEE6;color:#7C8599;box-shadow:none;cursor:not-allowed}
.btn-soft{background:var(--paper);color:var(--navy);border:2px solid var(--line)}
.btn-soft:hover{border-color:var(--navy)}
.icon{font-size:1.15em;line-height:1}

/* pilihan level */
.levels{display:flex;gap:8px}
.lvl{min-width:84px;min-height:52px;border-radius:14px;border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:700;padding:4px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.lvl small{font-size:.62em;letter-spacing:1px;color:var(--gold)}
.lvl.on{background:var(--gold);color:var(--navy)}
.lvl.on small{color:var(--navy)}
.lvl.locked{opacity:.45;cursor:not-allowed}

/* isi */
.main{overflow:auto;padding:20px 28px 28px;display:flex;flex-direction:column;gap:18px}
.story{display:flex;gap:18px;align-items:center;background:var(--paper);border-radius:var(--r-lg);padding:14px 22px;border:2px solid var(--line)}
.story .bina{flex:0 0 auto;width:72px;height:72px}
.story h2{font-size:1.2em;color:var(--navy);line-height:1.1}
.story p{color:var(--muted)}
.panel{background:var(--paper);border-radius:var(--r-lg);padding:18px 20px;border:2px solid var(--line);min-width:0}
.panel h3{font-size:1.05em;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.hint{color:var(--muted);font-size:.85em}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* modal hasil */
.modal{position:fixed;inset:0;background:rgba(18,26,56,.55);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--paper);border-radius:28px;max-width:980px;width:100%;max-height:92vh;overflow:auto;padding:28px 34px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.sheet .head{display:flex;align-items:center;gap:20px;margin-bottom:14px}
.stars{font-size:2.2em;letter-spacing:4px;color:var(--gold);line-height:1}
.stars .off{color:#D9DEE6}
.sheet h2{font-size:1.6em;color:var(--navy);line-height:1.1}
.sheet .sub{color:var(--muted)}
.metrics{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}
.metric{background:var(--sky);border-radius:var(--r-md);padding:10px 18px;min-width:150px}
.metric b{display:block;font-size:1.6em;color:var(--navy);line-height:1.1}
.metric span{color:var(--muted);font-size:.85em}
.explain{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-top:8px}
.explain .box{border-radius:var(--r-md);padding:16px 18px;background:var(--sky)}
.explain .box.ai{background:#FFF4D9}
.explain h3{font-size:1.05em;color:var(--navy);margin-bottom:8px}
.explain ul{margin:0;padding-left:1.1em}
.explain li{margin:4px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--navy);color:#fff;border-radius:999px;padding:4px 14px;font-size:.8em;font-weight:700}
.sheet .actions{margin-top:20px}
.detail{margin-top:12px;width:100%;border-collapse:collapse;font-size:.9em}
.detail td,.detail th{padding:8px 10px;border-bottom:2px solid var(--sky);text-align:left;vertical-align:middle}
.detail th{color:var(--muted);font-weight:700}
.ok{color:var(--leaf);font-weight:800}
.no{color:var(--coral);font-weight:800}

/* toast kecil */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(140%);background:var(--navy);color:#fff;padding:12px 24px;border-radius:999px;font-weight:700;transition:transform .25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  .explain{grid-template-columns:1fr}
  .topbar{flex-wrap:wrap;padding:10px 14px}
  .main{padding:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (max-height:800px){.main{padding-top:12px;gap:12px}.story{padding:8px 16px}.story .bina{width:52px;height:52px}.topbar{padding:8px 20px}.btn{min-height:46px;padding:8px 18px}.lvl{min-height:46px}}

/* tambahan Ekspedisi Bina (SMP) */
:root{--plum:#5B4B9A;--teal:#1F8A8A}
.seg{display:inline-flex;background:var(--sky);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;border-radius:999px;padding:6px 16px;min-height:44px;font-weight:700;background:transparent;color:var(--navy)}
.seg button.on{background:var(--navy);color:#fff}
.slider{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 56px;align-items:center;gap:12px;margin:8px 0}
.slider label{font-weight:700;color:var(--navy);line-height:1.15}
.slider input{width:100%;accent-color:var(--navy);height:28px}
.slider output{font-weight:800;color:var(--navy);text-align:right}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8em;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.q-opts button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-weight:700;text-align:left;min-height:56px}
.q-opts button:hover:not(:disabled){border-color:var(--navy)}
.q-opts button.right{background:#DDF2E0;border-color:#9BD3A0}
.q-opts button.wrong{background:#FBE0DB;border-color:#EFA79A}
.pill{display:inline-block;background:var(--sky);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.82em;color:var(--navy)}

/* Observatorium Bina (SMA) */
.app{height:100vh}
#home{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(ellipse at 70% 10%,#33478A 0%,#1E2E5C 45%,#141F42 100%);color:#fff;overflow:hidden}
#home .hero{display:flex;align-items:center;gap:22px;padding:24px 40px 0}
#home .hero .bina{width:88px;height:88px}
#home h1{font-size:2.4em;line-height:1;font-weight:800;color:#fff}
#home .hero p{color:#C7D0E8;margin-top:6px}
#home .spacer{flex:1}
#home .tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.sky{position:relative;margin:0 40px;min-height:0}
.sky svg.lines{position:absolute;inset:0;width:100%;height:100%}
.station{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink);width:min(19vw,240px)}
.station .disc{width:clamp(70px,7vw,100px);height:clamp(70px,7vw,100px);border-radius:50%;display:grid;place-items:center;font-size:clamp(32px,3.4vw,48px);border:5px solid var(--gold);box-shadow:0 0 0 8px rgba(232,178,58,.18);position:relative;transition:transform .15s}
.station:hover .disc,.station:focus-visible .disc{transform:scale(1.07)}
.station .num{position:absolute;top:-8px;left:-8px;background:var(--gold);color:var(--navy);border-radius:999px;font-weight:800;font-size:.5em;padding:1px 9px;line-height:1.5}
.station .card{background:#fff;border-radius:16px;padding:8px 14px;text-align:center;width:100%;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.station .card b{display:block;color:var(--navy);line-height:1.1}
.station .card span{display:block;color:var(--muted);font-size:.8em;line-height:1.2}
.station .card .st{color:var(--gold-d);font-weight:800;margin-top:2px}
#home .foot{display:flex;justify-content:space-between;align-items:center;padding:10px 40px 18px;color:#C7D0E8;font-size:.85em;gap:16px;flex-wrap:wrap}
#home .foot label{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;color:#fff}
#home .foot input{width:24px;height:24px;accent-color:var(--gold)}
.btn-glass{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.25)}
.board{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:18px;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.plot{width:100%;height:100%;max-height:100%}
.metricrow{display:flex;gap:10px;flex-wrap:wrap}
.metricrow .metric{min-width:120px;padding:8px 14px}
.metricrow .metric b{font-size:1.3em}
.goalbar{display:flex;gap:8px;flex-wrap:wrap}
.goal{border-radius:999px;padding:4px 14px;font-weight:700;font-size:.85em;background:var(--sky);color:var(--navy)}
.goal.ok{background:#DDF2E0;color:var(--leaf)}.goal.no{background:#FBE0DB;color:var(--coral)}
.cm{border-collapse:collapse;font-size:.92em}
.cm td,.cm th{padding:8px 12px;text-align:center;border:2px solid var(--sky)}
.cm th{color:var(--muted);font-size:.85em}
.cm .tp{background:#DDF2E0;color:var(--leaf);font-weight:800}.cm .tn{background:#E8F0FB;color:var(--navy);font-weight:800}
.cm .fp{background:#FFF0D6;color:#9A5B00;font-weight:800}.cm .fn{background:#FBE0DB;color:var(--coral);font-weight:800}
.guide .main{max-width:1180px;margin:0 auto;width:100%}
@media (max-width:1000px){.board{grid-template-columns:1fr}.sky svg.lines{display:none}.sky{display:grid;grid-template-columns:1fr 1fr;gap:14px;overflow:auto;margin:0 16px}.station{position:relative;transform:none;left:auto!important;top:auto!important;width:auto}}
.thumbs{display:flex;flex-direction:column;gap:6px}
.thumb{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;text-align:left;font-size:.9em}
.thumb.on{border-color:var(--navy);background:#FFF8E6}
.big{font-size:1.15em}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a.btn,a.station{text-decoration:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ===== Observatorium Bina: inti bersama ===== */
const OB = (() => {
  const KEY = 'observatorium-bina-v1';
  let state = { progress: {}, unlockAll: false };
  try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) state = Object.assign(state, s); } catch (e) {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  const stars = (g, l) => ((state.progress[g] || {})[l]) || 0;
  const unlocked = (g, l) => l === 1 || state.unlockAll || stars(g, l - 1) > 0;
  function save(g, l, s) { const p = state.progress[g] = state.progress[g] || {}; if (s > (p[l] || 0)) { p[l] = s; persist(); } }
  function home() { location.hash = '#peta'; }
  function fullscreen() {
    const d = document;
    if (!d.fullscreenElement) {
      const el = d.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return toast('Peramban ini tidak mendukung layar penuh.');
      try { const p = req.call(el); if (p && p.catch) p.catch(() => toast('Layar penuh diblokir di tampilan ini. Buka halaman di tab baru, lalu coba lagi.')); }
      catch (e) { toast('Layar penuh diblokir di tampilan ini. Buka halaman di tab baru, lalu coba lagi.'); }
    } else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  }
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3000);
  }
  function header(root, opts) {
    const bar = root.querySelector('.topbar');
    bar.innerHTML = `<button class="btn btn-ghost" data-a="home" aria-label="Kembali ke peta"><span class="icon">🔭</span> Peta</button>
      <div class="title"><span class="badge" aria-hidden="true" style="background:${opts.color}">${opts.icon}</span>${opts.title}</div><div class="spacer"></div>
      <div class="levels" role="tablist" aria-label="Pilih level"></div>
      <button class="btn btn-ghost" data-a="help" aria-label="Cara bermain"><span class="icon">❔</span></button>
      <button class="btn btn-ghost" data-a="full" aria-label="Layar penuh"><span class="icon">⛶</span></button>`;
    bar.querySelector('[data-a=home]').onclick = home;
    bar.querySelector('[data-a=full]').onclick = fullscreen;
    bar.querySelector('[data-a=help]').onclick = opts.onHelp;
    const box = bar.querySelector('.levels');
    const draw = () => {
      box.innerHTML = '';
      for (let i = 1; i <= 4; i++) {
        const s = stars(opts.game, i), un = unlocked(opts.game, i), b = document.createElement('button');
        b.className = 'lvl' + (i === opts.current() ? ' on' : '') + (un ? '' : ' locked');
        b.innerHTML = `Level ${i}<small>${un ? '★'.repeat(s) + '☆'.repeat(3 - s) : '🔒'}</small>`;
        b.setAttribute('aria-label', `Level ${i}${un ? `, ${s} bintang` : ', terkunci'}`);
        b.onclick = () => { if (un) opts.onPick(i); else toast('Selesaikan level sebelumnya dulu.'); };
        box.appendChild(b);
      }
    };
    draw(); return { redraw: draw };
  }
  function modal(id) { let m = document.getElementById(id); if (!m) { m = document.createElement('div'); m.id = id; m.className = 'modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); document.body.appendChild(m); } return m; }
  function result(o) {
    const m = modal('resultModal'), st = o.stars || 0;
    m.innerHTML = `<div class="sheet"><div class="head"><div class="stars" aria-label="${st} bintang">${[1,2,3].map(i => `<span class="${i <= st ? '' : 'off'}">★</span>`).join('')}</div>
      <div><h2>${o.title}</h2><p class="sub">${o.subtitle || ''}</p></div></div>
      ${o.metrics ? `<div class="metrics">${o.metrics.map(x => `<div class="metric"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>` : ''}
      ${o.detail || ''}
      <div class="explain"><div class="box"><h3>Apa yang terjadi?</h3><ul>${o.what.map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div class="box ai"><h3>Hubungannya dengan AI</h3><p>${o.ai}</p><div class="chips">${(o.ct || []).map(c => `<span class="chip">${c}</span>`).join('')}</div></div></div>
      <div class="actions"><button class="btn btn-soft" data-r="retry"><span class="icon">↻</span> Coba lagi</button>
      ${o.next ? `<button class="btn btn-main" data-r="next">Level berikutnya</button>` : `<button class="btn btn-main" data-r="home">Kembali ke peta</button>`}</div></div>`;
    m.classList.add('show');
    const close = () => m.classList.remove('show');
    m.querySelector('[data-r=retry]').onclick = () => { close(); o.onRetry && o.onRetry(); };
    const n = m.querySelector('[data-r=next]'); if (n) n.onclick = () => { close(); o.next(); };
    const h = m.querySelector('[data-r=home]'); if (h) h.onclick = () => { close(); home(); };
    (n || h).focus({ preventScroll: true }); m.querySelector('.sheet').scrollTop = 0;
  }
  function info(title, html) {
    const m = modal('infoModal');
    m.innerHTML = `<div class="sheet"><h2 style="margin-bottom:12px">${title}</h2>${html}<div class="actions"><button class="btn btn-main" data-i="ok">Mengerti, ayo mulai</button></div></div>`;
    m.classList.add('show'); m.querySelector('[data-i=ok]').onclick = () => m.classList.remove('show'); m.querySelector('[data-i=ok]').focus();
  }
  function lineChart(series, opts = {}) {
    const W = opts.w || 520, H = opts.h || 200, P = 40;
    const all = series.flatMap(s => s.data.filter(v => isFinite(v)));
    const ymin = opts.ymin ?? Math.min(0, ...all), ymax = opts.ymax ?? Math.max(1, ...all);
    const n = opts.n || Math.max(...series.map(s => s.data.length));
    const x = i => P + (W - P - 10) * (n <= 1 ? 0 : i / (n - 1));
    const y = v => { const t = (Math.min(ymax, Math.max(ymin, v)) - ymin) / ((ymax - ymin) || 1); return H - 24 - (H - 34) * t; };
    let g = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label || 'grafik'}">`;
    [0, 0.5, 1].forEach(t => { const v = ymin + (ymax - ymin) * t; g += `<line x1="${P}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="#E3E9F0"/><text x="${P - 6}" y="${y(v) + 4}" font-size="12" text-anchor="end" fill="#56607C">${opts.fmt ? opts.fmt(v) : Math.round(v)}</text>`; });
    if (opts.xticks) opts.xticks.forEach((t, i) => g += `<text x="${x(i)}" y="${H - 8}" font-size="12" text-anchor="middle" fill="#56607C">${t}</text>`);
    else if (opts.xlabel) g += `<text x="${W / 2}" y="${H - 6}" font-size="12" text-anchor="middle" fill="#56607C">${opts.xlabel}</text>`;
    if (opts.mark !== undefined) g += `<line x1="${x(opts.mark)}" x2="${x(opts.mark)}" y1="10" y2="${H - 24}" stroke="#E8B23A" stroke-width="3" stroke-dasharray="5 4"/>`;
    series.forEach(s => { const pts = s.data.map((v, i) => isFinite(v) ? `${x(i).toFixed(1)},${y(v).toFixed(1)}` : null).filter(Boolean); if (pts.length) g += `<polyline fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts.join(' ')}"/>` + (s.dots ? s.data.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}"/>`).join('') : ''); });
    return g + '</svg>' + (series.length > 1 || opts.legend ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>` : '');
  }
  const rng = seed => { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; };
  const bina = `<svg class="bina" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="44" r="30" fill="#A8692F"/><circle cx="18" cy="20" r="8" fill="#A8692F"/><circle cx="62" cy="20" r="8" fill="#A8692F"/><circle cx="18" cy="20" r="4" fill="#7A4A1E"/><circle cx="62" cy="20" r="4" fill="#7A4A1E"/><ellipse cx="40" cy="54" rx="17" ry="13" fill="#E8C49A"/><circle cx="29" cy="38" r="7" fill="#fff" stroke="#1E2E5C" stroke-width="2.5"/><circle cx="51" cy="38" r="7" fill="#fff" stroke="#1E2E5C" stroke-width="2.5"/><line x1="36" y1="38" x2="44" y2="38" stroke="#1E2E5C" stroke-width="2.5"/><circle cx="30" cy="39" r="2.6" fill="#1E2E5C"/><circle cx="52" cy="39" r="2.6" fill="#1E2E5C"/><ellipse cx="40" cy="49" rx="6" ry="4.5" fill="#3B2410"/><rect x="35" y="56" width="4.5" height="7" rx="1" fill="#fff"/><rect x="40.5" y="56" width="4.5" height="7" rx="1" fill="#fff"/></svg>`;
  function frame(root, game, opts) {

  else { tries++; const res = TESTS[4].map(([im, tgt]) => ({ im, cl: classify(im), tgt })); const n = res.filter(r => r.cl === r.tgt).length; ok = n === 7; stars = ok ? (tries <= 3 ? 3 : 2) : n >= 5 ? 1 : 0;
    metrics = [[`${n} / 7`, 'gambar dikenali'], [tries, 'kali uji']];
    what = [`Filter A: ${fstr(F)}. Filter B: ${fstr(F2)}.`, 'Mesin tidak melihat “tanda tambah”. Ia hanya punya dua angka: seberapa kuat pola tegak dan pola datar ditemukan. Bentuk dikenali dari <b>kombinasi fitur</b>.', ok ? 'Gambar kotak-kotak tidak menyalakan kedua filter, jadi mesin dengan benar menjawab “bukan garis”.' : 'Periksa gambar bertanda ✗: filter mana yang menyala padahal tidak seharusnya, atau sebaliknya?']; }
  if (stars) OB.save('m5', L, stars);
  OB.result({ stars, title: ok ? (stars === 3 ? 'Mata komputer yang tajam!' : 'Berhasil!') : 'Filter belum tepat', subtitle:`Level ${L}: ${INFO[L-1].t}`, metrics, what,
    ai: L === 4 ? 'Jaringan saraf konvolusi (CNN) menyusun ratusan filter dalam banyak lapisan: lapisan awal mengenali garis, lapisan berikutnya menggabungkannya menjadi sudut, bentuk, lalu wajah atau benda. Bedanya, filter itu <b>dipelajari sendiri</b> dari data, bukan dirancang manusia.'
      : 'Inilah cara dasar AI “melihat”. <b>Jaringan saraf konvolusi</b> (CNN) memakai filter seperti ini untuk mengenali tulisan tangan, rambu lalu lintas, sampai penyakit pada foto rontgen.',
    ct: ['Pengenalan pola','Abstraksi', L >= 3 ? 'Dekomposisi' : 'Algoritma'], onRetry:() => { if (L === 1) start(1); }, next: ok && L < 4 ? () => start(L + 1) : null });
}
return { id:'m5', icon:'👁', color:'#E8892E', title:'Mata Komputer', idea:'Bagaimana AI melihat: filter dan konvolusi', topics:'Piksel, konvolusi, peta fitur, CNN',
  mount(el, lvl){ root = el; hdr = OB.frame(root, 'm5', { icon:'👁', color:'#E8892E', title:'Mata Komputer', current:() => L, onPick:start,
    onHelp:() => OB.info('Cara bermain', '<p>Gambar 8×8 terdiri dari piksel bernilai 1 (gelap) dan 0 (terang). Filter 3×3 digeser ke 36 posisi.</p><p style="margin-top:10px">Di setiap posisi: kalikan piksel dengan angka filter yang bertumpuk, lalu jumlahkan. Hasilnya ditulis di <b>peta fitur</b>. Kuning = positif, biru = negatif.</p><p style="margin-top:10px"><b>Respons</b> = angka terbesar di peta fitur.</p>') });
    start(lvl && OB.unlocked('m5', lvl) ? lvl : 1); }
};
})());

const POS = [[14, 58], [34, 30], [52, 62], [70, 30], [87, 60]];

function renderHome(root){

function route(){

}
