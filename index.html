<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CT Bebras UII · Berpikir Komputasional dan AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sd/common.css">
<style>
  body{overflow:auto;background:linear-gradient(180deg,#DDF0F5 0%,#EAF4F7 55%,#E3F1E4 100%);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:40px 24px}
  h1{font-size:2.3em;color:var(--navy);line-height:1.05}
  .lead{color:var(--muted);margin-top:8px}
  .levels-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:32px}
  .jenjang{display:flex;flex-direction:column;gap:10px;background:#fff;border:2px solid var(--line);border-radius:var(--r-lg);padding:22px;text-decoration:none;color:var(--ink);box-shadow:0 6px 0 rgba(30,46,92,.08);transition:transform .12s}
  a.jenjang:hover,a.jenjang:focus-visible{transform:translateY(-3px);border-color:var(--navy)}
  .jenjang .disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:36px;color:#fff}
  .jenjang b{font-size:1.3em;color:var(--navy);line-height:1.1}
  .jenjang span{color:var(--muted);font-size:.9em}
  .jenjang .tag{align-self:flex-start;border-radius:999px;padding:2px 12px;font-weight:700;font-size:.8em;background:var(--sky);color:var(--muted)}
  .jenjang .tag.ready{background:#DDF2E0;color:var(--leaf)}
</style>
</head>
<body>
<main class="wrap">
  <h1>CT Bebras UII</h1>
  <p class="lead">Permainan untuk berlatih berpikir komputasional dan mengenal cara kerja AI. Pilih jenjang sekolah.</p>
  <div class="levels-grid">
    <a class="jenjang" href="sd/">
      <span class="disc" style="background:#F4A24B">🦫</span>
      <b>SD</b><span>Petualangan Bina: empat permainan untuk kelas 1–6</span>
      <span class="tag ready">Tersedia</span>
    </a>
    <a class="jenjang" href="sm/">
      <span class="disc" style="background:#5BC0CC">🧭</span>
      <b>SMP</b><span>Ekspedisi Bina: permainan untuk jenjang SMP</span>
      <span class="tag ready">Tersedia</span>
    </a>
    <a class="jenjang" href="sma/">
      <span class="disc" style="background:#8C8FE0">🚀</span>
      <b>SMA</b><span>Observatorium Bina: permainan untuk jenjang SMA</span>
      <span class="tag ready">Tersedia</span>
    </a>
  </div>
</main>
</body>
</html>
